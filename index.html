<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goalfinity Institute · Career Assessment</title>
<style>
:root{--navy:#12296b;--ink:#0f1d3d;--green:#2f7d45;--green-d:#256438;--mint:#eaf5ee;--bg:#f6f8fb;--card:#fff;--line:#dde3ec;--mute:#56627a;--warn:#a15c00;
--serif:Georgia,"Times New Roman",serif;--sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.55}
h1,h2,h3{font-family:var(--serif);color:var(--navy);line-height:1.2;margin:0 0 .5rem}
h1{font-size:clamp(1.9rem,4.5vw,2.9rem)}h2{font-size:1.5rem}h3{font-size:1.1rem}
p{margin:0 0 .8rem}
.top{background:#fff;border-bottom:1px solid var(--line)}
.top .in{max-width:980px;margin:0 auto;padding:.7rem 1.2rem;display:flex;align-items:center;gap:.9rem}
.top img,.brand img{height:54px;width:auto;display:block}
.top .nm{font-family:var(--serif);color:var(--navy);font-weight:700;font-size:1.05rem}
.top .tg{color:var(--mute);font-size:.85rem}
main{max-width:980px;margin:0 auto;padding:1.6rem 1.2rem 3rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.6rem;box-shadow:0 1px 2px rgba(18,41,107,.05),0 6px 20px rgba(18,41,107,.05)}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:2rem;align-items:center}
.hero .lead{font-size:1.1rem;color:var(--mute);max-width:46ch}
.hero ul{margin:0;padding:0;list-style:none;display:grid;gap:.7rem}
.hero li{padding:.8rem 1rem;border-left:4px solid var(--green);background:var(--mint);border-radius:0 10px 10px 0;font-size:.95rem}
.hero li b{display:block;color:var(--navy)}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:.75rem 1.3rem;border:1.5px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
.btn.pri{background:var(--navy);color:#fff}.btn.grn{background:var(--green);border-color:var(--green);color:#fff}
.btn:hover:not(:disabled){filter:brightness(.94)}.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid #1b8aa6;outline-offset:2px}
label.f{display:block;font-weight:600;margin-bottom:.35rem}
input[type=text]{width:100%;font:inherit;padding:.75rem .9rem;border:1.5px solid #b9c3d3;border-radius:10px}
.courses{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;border:0;padding:0;margin:0 0 1.4rem}
.courses legend{font-weight:600;margin-bottom:.5rem;padding:0}
.opt{position:relative;display:block}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.opt span{display:block;padding:.9rem 1rem;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-weight:600;color:var(--navy);height:100%}
.opt input:checked+span{border-color:var(--green);background:var(--mint);box-shadow:inset 0 0 0 1px var(--green)}
.opt input:focus-visible+span{outline:3px solid #1b8aa6;outline-offset:2px}
.opt small{display:block;font-weight:400;color:var(--mute);margin-top:.2rem}
.prog{height:8px;background:#e4e9f1;border-radius:99px;overflow:hidden;margin:.4rem 0 1.2rem}
.prog i{display:block;height:100%;background:var(--green);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.9rem;gap:1rem;flex-wrap:wrap}
.q{font-family:var(--serif);font-size:clamp(1.25rem,2.6vw,1.6rem);color:var(--navy);margin:.3rem 0 1.2rem;line-height:1.3}
fieldset.ans{border:0;padding:0;margin:0;display:grid;gap:.6rem}
.nav{display:flex;justify-content:space-between;gap:.8rem;margin-top:1.4rem;flex-wrap:wrap}
.rv{display:grid;grid-template-columns:2.2rem 1fr auto;gap:.8rem;padding:.75rem 0;border-bottom:1px solid var(--line);align-items:start}
.rv:last-of-type{border:0}.rv .n{font-weight:700;color:var(--green)}.rv .a{color:var(--mute);font-size:.92rem}.rv .a.miss{color:var(--warn);font-weight:600}
.btn.sm{padding:.35rem .8rem;font-size:.88rem}
.rhead{display:flex;justify-content:space-between;gap:1.5rem;align-items:center;border-bottom:3px solid var(--navy);padding-bottom:1rem;margin-bottom:1.2rem;flex-wrap:wrap}
.rhead img{height:72px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-bottom:1.4rem}
.facts div{background:var(--bg);border-radius:10px;padding:.7rem .9rem}.facts small{display:block;color:var(--mute)}.facts b{color:var(--navy)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem;margin-bottom:1.4rem}
.score{display:flex;align-items:baseline;gap:.6rem;margin-bottom:.3rem}.score b{font-family:var(--serif);font-size:3rem;color:var(--navy)}
.pill{display:inline-block;background:var(--green);color:#fff;border-radius:99px;padding:.15rem .8rem;font-weight:600;font-size:.9rem}
.bar{margin:.55rem 0}.bar div:first-child{display:flex;justify-content:space-between;font-size:.9rem;gap:1rem}
.bar .t{height:9px;background:#e4e9f1;border-radius:99px;overflow:hidden}.bar .t i{display:block;height:100%;background:var(--navy);border-radius:99px}
.bar .t i.g{background:var(--green)}.bar .t i.w{background:#c98a1b}
ul.l{margin:.2rem 0 0;padding-left:1.1rem}ul.l li{margin:.25rem 0}
.note{font-size:.82rem;color:var(--mute);border-top:1px solid var(--line);padding-top:.8rem;margin-top:1.4rem}
.acts{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.2rem}
.lg{display:flex;gap:1rem;flex-wrap:wrap;font-size:.8rem;color:var(--mute);margin:0 0 .4rem}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.35rem;background:var(--navy)}.lg i.g{background:var(--green)}.lg i.w{background:#c98a1b}
.hide{display:none!important}
@media(max-width:720px){.hero,.grid2{grid-template-columns:1fr}.courses{grid-template-columns:1fr}.facts{grid-template-columns:1fr}.top .tg{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{body{background:#fff}.top,.acts,.noprint{display:none!important}main{padding:0;max-width:none}.card{box-shadow:none;border:0;padding:0}.grid2,.facts{break-inside:avoid}.bar,.rhead{break-inside:avoid}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

function buildQs(course){
  const qs=[
   {t:"How familiar are you with data, programming, and technology concepts such as structured and unstructured data, SQL, Python, or Business Intelligence?",tag:"Data & tech concepts",o:"q1",cat:"found"},
   {t:"Have you ever worked on a technical, analytical, marketing, or technology-related project?",tag:"Prior project work",o:"q2",cat:"found"}];
  BANK[course].forEach(b=>qs.push({t:b[0],tag:b[1],o:b[2],cat:b[2]==K?"know":"exp"}));
  qs.push(
   {t:"Have you applied the skills you know to a real problem, such as a study task, work task, or personal project?",tag:"Real-world application",o:E,cat:"apply"},
   {t:"Have you shared your work, for example through a portfolio, GitHub, presentation, or written summary?",tag:"Sharing & documenting work",o:E,cat:"apply"},
   {t:"How clearly can the student explain a technical or project idea in simple words?",tag:"Explaining ideas",o:"c",cat:"comm"},
   {t:"How well does the student listen, ask questions, and respond during the counselling conversation?",tag:"Listening & responding",o:"c",cat:"comm"});
  return qs; /* always exactly 15 */
}
const CATS={found:"Technology foundation",know:"Course knowledge",exp:"Hands-on experience",apply:"Practical application",comm:"Communication"};
const PATH={
 ai:["Start with Python and data foundations before moving into machine learning.","Join the core Machine Learning and Data Science track, with hands-on mini projects.","Move to Deep Learning, NLP, and Generative AI, with a project-led approach.","Join advanced GenAI, RAG, and MLOps projects, and build a deployable portfolio."],
 dm:["Start with digital marketing fundamentals: search, social media, and content basics.","Join the core track covering SEO, paid ads, and analytics, with live campaign practice.","Move to advanced paid media, automation, and conversion optimisation.","Join advanced strategy and analytics projects, with real campaign ownership."],
 cc:["Start with cloud, Linux, and networking fundamentals before choosing a platform.","Join the core cloud track on one platform, with guided labs.","Move to containers, DevOps, and Infrastructure as Code, with project labs.","Join advanced architecture, automation, and certification preparation."]};
const LEVELS=["Beginner","Developing","Proficient","Advanced"];

const S={screen:"welcome",name:"",course:"",qs:[],ans:[],i:0,date:null};
const $=id=>document.getElementById(id), app=$("app");
document.querySelectorAll("img.logo").forEach(i=>{i.src=LOGO_SRC;i.onerror=()=>{i.replaceWith(Object.assign(document.createElement("b"),{textContent:"GOALFINITY",style:"color:#12296b;font-size:1.3rem"}))}});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const score=(q,a)=>a==null?null:(q.o=="c"?SCC[a]:SC4[a]);
const optText=(q,a)=>a==null?null:OPTS[q.o][a];
const isNA=(q,a)=>a!=null&&q.o!="c"&&q.o!="q1"&&q.o!="q2"&&a==4;

function go(s){S.screen=s;render();window.scrollTo(0,0);setTimeout(()=>{const h=app.querySelector("h1,h2");if(h){h.tabIndex=-1;h.focus({preventScroll:true})}},0)}

function render(){
 if(S.screen=="welcome") app.innerHTML=`<section class="card hero"><div>
  <h1>Career readiness assessment</h1>
  <p class="lead">A 15-question conversation guide for admission counsellors. It produces a clear skills profile and a recommended learning path for Artificial Intelligence, Digital Marketing, or Cloud Computing.</p>
  <button class="btn grn" data-a="start">Begin assessment</button></div>
  <ul><li><b>15 questions, about 10 minutes</b>Counsellor records the answers during the conversation.</li>
  <li><b>Personal data kept minimal</b>Only the student's name is entered. Nothing is stored or sent anywhere.</li>
  <li><b>Printable report</b>Charts, strengths, gaps, and a recommended pathway.</li></ul></section>`;
 if(S.screen=="setup") app.innerHTML=`<section class="card" style="max-width:640px;margin:0 auto"><h2>Assessment setup</h2>
  <p style="color:var(--mute)">Enter the student's name and choose the course they are enquiring about.</p>
  <label class="f" for="nm">Student name</label><input type="text" id="nm" autocomplete="off" value="${esc(S.name)}" style="margin-bottom:1.2rem">
  <fieldset class="courses"><legend>Course</legend>${Object.entries(COURSES).map(([k,c])=>`<label class="opt"><input type="radio" name="course" value="${k}" ${S.course==k?"checked":""}><span>${c.name}<small>${c.blurb}</small></span></label>`).join("")}</fieldset>
  <p id="err" class="hide" style="color:#b3261e;font-weight:600" role="alert"></p>
  <div class="nav" style="margin-top:0"><button class="btn" data-a="home">Back</button><button class="btn pri" data-a="begin">Start questions</button></div></section>`;
 if(S.screen=="quiz"){
  const q=S.qs[S.i],n=S.i+1,sel=S.ans[S.i],opts=OPTS[q.o];
  app.innerHTML=`<section class="card" style="max-width:760px;margin:0 auto">
   <div class="meta"><span><b>${esc(S.name)}</b> · ${COURSES[S.course].name}</span><span>Question ${n} of 15</span></div>
   <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="15" aria-valuenow="${n}" aria-label="Assessment progress"><i style="width:${n/15*100}%"></i></div>
   <p style="color:var(--green-d);font-weight:600;margin:0">${CATS[q.cat]}</p>
   <h2 class="q" tabindex="-1" id="qh">${n}. ${esc(q.t)}</h2>
   <fieldset class="ans"><legend class="hide">Response</legend>${opts.map((o,k)=>`<label class="opt"><input type="radio" name="ans" value="${k}" ${sel===k?"checked":""}><span>${esc(o)}</span></label>`).join("")}</fieldset>
   <div class="nav"><button class="btn" data-a="prev">${S.i==0?"Back to setup":"Previous"}</button>
   <button class="btn pri" data-a="next" ${sel==null?"disabled":""}>${S.i==14?"Review answers":"Next"}</button></div></section>`;
 }
 if(S.screen=="review"){
  const miss=S.ans.filter(a=>a==null).length;
  app.innerHTML=`<section class="card" style="max-width:820px;margin:0 auto"><h2>Review answers</h2>
   <p style="color:var(--mute)">${esc(S.name)} · ${COURSES[S.course].name}. Select Edit to change any answer.</p>
   ${miss?`<p style="color:var(--warn);font-weight:600" role="alert">${miss} question${miss>1?"s":""} still need an answer before the report can be generated.</p>`:""}
   ${S.qs.map((q,k)=>`<div class="rv"><span class="n">${k+1}</span><div><div>${esc(q.t)}</div><div class="a ${S.ans[k]==null?"miss":""}">${S.ans[k]==null?"Not answered":esc(optText(q,S.ans[k]))}</div></div><button class="btn sm" data-a="edit" data-k="${k}" aria-label="Edit answer ${k+1}">Edit</button></div>`).join("")}
   <div class="nav"><button class="btn" data-a="back15">Previous</button><button class="btn grn" data-a="gen" ${miss?"disabled":""}>Generate report</button></div></section>`;
 }
 if(S.screen=="report") report();
 const h=$("qh");if(h&&S.screen=="quiz"&&S._focus){h.focus({preventScroll:true});S._focus=false}
}

function calc(){
 const by={};let all=[];
 S.qs.forEach((q,k)=>{const v=score(q,S.ans[k]);if(v==null)return;(by[q.cat]=by[q.cat]||[]).push(v);all.push(v)});
 const avg=a=>a&&a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
 const cats=Object.keys(CATS).map(c=>({k:c,label:CATS[c],v:avg(by[c])}));
 const weights={found:.15,know:.3,exp:.3,apply:.1,comm:.15};
 let ws=0,wt=0;cats.forEach(c=>{if(c.v!=null){ws+=c.v*weights[c.k];wt+=weights[c.k]}});
 const total=wt?Math.round(ws/wt):0;
 const lvl=total<20?0:total<45?1:total<75?2:3;
 const topics=S.qs.map((q,k)=>({tag:q.tag,cat:q.cat,v:score(q,S.ans[k])})).filter(t=>t.v!=null&&t.cat!="comm");
 const sorted=[...topics].sort((a,b)=>b.v-a.v);
 return{cats,total,lvl,topics,strengths:sorted.filter(t=>t.v>=85).slice(0,4),gaps:[...sorted].reverse().filter(t=>t.v<85).slice(0,4),
  na:S.qs.filter((q,k)=>S.ans[k]==null||isNA(q,S.ans[k])).length};
}
function radar(cats){
 const cx=170,cy=150,R=100,n=cats.length,pt=(i,r)=>{const a=-Math.PI/2+2*Math.PI*i/n;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]};
 const ring=f=>cats.map((c,i)=>pt(i,R*f).join(",")).join(" ");
 const poly=cats.map((c,i)=>pt(i,R*(c.v||0)/100).join(",")).join(" ");
 const short=["Foundation","Knowledge","Experience","Application","Communication"];
 return`<svg viewBox="0 0 340 300" role="img" aria-label="Skills profile radar chart: ${cats.map(c=>c.label+" "+(c.v==null?"not assessed":c.v+" percent")).join(", ")}" style="width:100%;max-width:380px;display:block;margin:auto">
 ${[.25,.5,.75,1].map(f=>`<polygon points="${ring(f)}" fill="none" stroke="#dde3ec"/>`).join("")}
 ${cats.map((c,i)=>`<line x1="${cx}" y1="${cy}" x2="${pt(i,R)[0]}" y2="${pt(i,R)[1]}" stroke="#dde3ec"/>`).join("")}
 <polygon points="${poly}" fill="rgba(47,125,69,.22)" stroke="#2f7d45" stroke-width="2.5"/>
 ${cats.map((c,i)=>{const p=pt(i,R*(c.v||0)/100),l=pt(i,R+22);return`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#12296b"/><text x="${l[0]}" y="${l[1]}" font-size="12" fill="#12296b" font-weight="600" text-anchor="${l[0]<cx-5?"end":l[0]>cx+5?"start":"middle"}" dominant-baseline="middle">${short[i]}</text>`}).join("")}</svg>`;
}
const bar=(l,v,cls="")=>`<div class="bar"><div><span>${esc(l)}</span><b>${v==null?"Not assessed":v+"%"}</b></div><div class="t"><i class="${cls}" style="width:${v||0}%"></i></div></div>`;

function report(){
 const r=calc(),c=COURSES[S.course];
 const date=S.date.toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"});
 const sum=`${esc(S.name)} shows a <b>${LEVELS[r.lvl].toLowerCase()}</b> level of readiness for ${c.name}, with an overall score of ${r.total}%.`+
  (r.strengths.length?` The strongest areas are ${r.strengths.slice(0,2).map(s=>s.tag.toLowerCase()).join(" and ")}.`:" There are no established strengths in this area yet, so the learning path starts from the basics.")+
  (r.gaps.length?` The main areas to build are ${r.gaps.slice(0,2).map(s=>s.tag.toLowerCase()).join(" and ")}.`:"");
 const comm=r.cats.find(x=>x.k=="comm").v;
 const steps=[PATH[S.course][r.lvl],
  r.gaps.length?`Focus early practice on: ${r.gaps.map(g=>g.tag).join(", ")}.`:"Keep building depth with portfolio-level projects.",
  comm!=null&&comm<85?"Add guided presentation and communication practice alongside technical work.":"Communication is a good base for interviews and client-facing work.",
  "Complete at least one hands-on project during the course to evidence skills."];
 app.innerHTML=`<section class="card" id="rep">
  <div class="rhead"><div><h1 style="font-size:1.9rem">Career assessment report</h1><div style="color:var(--mute)">Discover Your Skills. Build Your Future.</div></div><img class="logo" src="${LOGO_SRC}" alt="Goalfinity Institute"></div>
  <div class="facts"><div><small>Student</small><b>${esc(S.name)}</b></div><div><small>Course</small><b>${c.name}</b></div><div><small>Assessment date</small><b>${date}</b></div></div>
  <div class="grid2"><div><h3>Overall readiness</h3><div class="score"><b>${r.total}%</b><span class="pill">${LEVELS[r.lvl]}</span></div><p>${sum}</p></div>
  <div>${radar(r.cats)}</div></div>
  <div class="grid2"><div><h3>Skill areas</h3><p class="lg"><span><i class="g"></i>Fully confident</span><span><i class="n"></i>Some doubt</span><span><i class="w"></i>Low confidence</span></p>${r.cats.map(x=>bar(x.label,x.v,x.v>=85?"g":x.v!=null&&x.v<40?"w":"")).join("")}</div>
  <div><h3>Topic breakdown</h3><p class="lg"><span><i class="g"></i>Fully confident</span><span><i class="n"></i>Some doubt</span><span><i class="w"></i>Low confidence</span></p>${r.topics.map(t=>bar(t.tag,t.v,t.v>=85?"g":t.v<40?"w":"")).join("")}</div></div>
  <div class="grid2"><div><h3>Strengths</h3>${r.strengths.length?`<ul class="l">${r.strengths.map(s=>`<li>${esc(s.tag)}</li>`).join("")}</ul>`:"<p>No topics at a working level yet.</p>"}</div>
  <div><h3>Areas to develop</h3>${r.gaps.length?`<ul class="l">${r.gaps.map(s=>`<li>${esc(s.tag)}</li>`).join("")}</ul>`:"<p>No major gaps identified.</p>"}</div></div>
  <h3>Recommended pathway</h3><ul class="l">${steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>
  <p class="note">This is an indicative assessment based on responses recorded by the counsellor during conversation. ${r.na?`${r.na} question${r.na>1?"s were":" was"} marked Not assessed and excluded from scoring. `:""}Scoring is deliberately strict: full marks are given only for complete confidence, and any doubt lowers the score. It is a guide for course selection, not a formal test result.</p>
  <div class="acts noprint"><button class="btn pri" data-a="print">Print report</button><button class="btn pri" data-a="print">Save as PDF</button><button class="btn" data-a="review">Edit answers</button><button class="btn grn" data-a="new">New assessment</button></div>
  <p class="note noprint" style="border:0;margin:0">To save as PDF, choose "Save as PDF" as the destination in the print window.</p></section>`;
}

app.addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
 if(a=="start")go("setup");
 if(a=="home")go("welcome");
 if(a=="begin"){
  const nm=$("nm").value.trim(),co=(document.querySelector('input[name=course]:checked')||{}).value;
  if(!nm||!co){const er=$("err");er.textContent=!nm?"Enter the student's name.":"Select a course.";er.classList.remove("hide");return}
  if(co!=S.course||nm!=S.name||!S.qs.length){if(co!=S.course||!S.qs.length){S.qs=buildQs(co);S.ans=Array(15).fill(null)}}
  S.name=nm;S.course=co;S.i=0;S.date=S.date||new Date();S._focus=true;go("quiz");
 }
 if(a=="prev"){if(S.i==0)go("setup");else{S.i--;S._focus=true;render()}}
 if(a=="next"){if(S.i==14)go("review");else{S.i++;S._focus=true;render()}}
 if(a=="edit"){S.i=+b.dataset.k;S._focus=true;go("quiz")}
 if(a=="back15"){S.i=14;S._focus=true;go("quiz")}
 if(a=="gen")go("report");
 if(a=="review")go("review");
 if(a=="print")window.print();
 if(a=="new"){Object.assign(S,{name:"",course:"",qs:[],ans:[],i:0,date:null});go("welcome")}
});
app.addEventListener("change",e=>{
 if(e.target.name=="ans"){S.ans[S.i]=+e.target.value;app.querySelector('[data-a=next]').disabled=false}
});
app.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.id=="nm"){e.preventDefault();app.querySelector('[data-a=begin]').click()}});
render();
</script>
</body>
</html>
